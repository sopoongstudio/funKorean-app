<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Practice — Learn Korean</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root{--bg:#F0F4F8;--surface:#FFFFFF;--surface2:#F0F4F8;--accent:#FF6B6B;--accent2:#FFD93D;--accent3:#4D96FF;--text:#0F172A;--text-muted:#475569;--border:#CBD5E1;}
  *{margin:0;padding:0;box-sizing:border-box;}html{font-size:17px;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans','Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;font-weight:450;-webkit-font-smoothing:antialiased;}
  header{padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem;border-bottom:1px solid var(--border);background:rgba(240,244,248,.95);position:sticky;top:0;z-index:10;}
  .logo{display:flex;align-items:baseline;gap:.6rem;}
  .logo-hangul{font-family:'Noto Sans KR',sans-serif;font-size:1.8rem;font-weight:900;color:var(--accent);letter-spacing:-1px;}
  .logo-en{font-size:.85rem;color:var(--text-muted);font-weight:300;letter-spacing:2px;text-transform:uppercase;}

  .pp-wrap{max-width:480px;margin:0 auto;}
  .pp-modes{display:flex;gap:.6rem;margin-bottom:1.2rem;justify-content:center;flex-wrap:wrap;}
  .pp-mode-btn{padding:.5rem 1.1rem;border-radius:99px;border:2px solid var(--border);background:var(--surface2);color:var(--text-muted);font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;font-size:.8rem;}
  .pp-mode-btn.active{background:#10B981;border-color:#10B981;color:white;}
  .pp-score{text-align:center;font-size:.8rem;color:#64748B;margin-bottom:1rem;font-weight:600;}
  .pp-scene{background:#F0FDF4;border:1.5px solid #BBF7D0;border-radius:16px;padding:1.6rem 1.2rem;text-align:center;margin-bottom:1.2rem;}
  .pp-clerk-line{font-size:.85rem;color:#166534;margin-bottom:.6rem;font-weight:600;}
  .pp-options{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
  .pp-option{background:#FFFDF9;border:1.5px solid rgba(255,217,61,.3);border-radius:12px;padding:.85rem .7rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:.95rem;font-weight:700;color:#0F172A;text-align:center;transition:all .15s;}
  .pp-option:hover{border-color:#FFD93D;background:#FFFBEB;}
  .pp-option.correct{background:#DCFCE7;border-color:#22C55E;color:#166534;}
  .pp-option.wrong{background:#FEE2E2;border-color:#EF4444;color:#991B1B;}
  .pp-feedback{text-align:center;margin-top:1rem;font-weight:700;font-size:.95rem;min-height:1.3rem;}
  .pp-next-btn{display:block;margin:1rem auto 0;background:#FF6B6B;color:white;border:none;border-radius:99px;padding:.6rem 1.6rem;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;}
  .pp-receipt-speak{margin-top:.7rem;background:none;border:1.5px solid #CBD5E1;color:#475569;border-radius:99px;padding:.35rem 1rem;font-size:.78rem;cursor:pointer;}

  .tp-clock{font-family:'DM Sans',sans-serif;font-size:2.4rem;font-weight:800;color:#1E40AF;margin:.3rem 0 .8rem;}
  .tp-mic-btn{background:#3B82F6;border:none;color:white;width:64px;height:64px;border-radius:50%;font-size:1.7rem;cursor:pointer;box-shadow:0 4px 14px rgba(59,130,246,.35);}
  .tp-mic-btn.recording{background:#EF4444;box-shadow:0 0 0 8px rgba(239,68,68,.15);animation:tpPulse 1s infinite;}
  @keyframes tpPulse{0%,100%{box-shadow:0 0 0 6px rgba(239,68,68,.15);}50%{box-shadow:0 0 0 12px rgba(239,68,68,.05);}}
  .tp-mic-hint{font-size:.75rem;color:#64748B;margin-top:.6rem;}
  .tp-transcript{margin-top:.7rem;font-family:'Noto Sans KR',sans-serif;font-size:.9rem;color:#334155;background:#F1F5F9;border-radius:8px;padding:.4rem .8rem;display:inline-block;min-height:1.2rem;}
  .tp-unsupported{background:#FEF3C7;border:1.5px solid #FDE68A;border-radius:10px;padding:.9rem 1rem;font-size:.82rem;color:#92400E;text-align:center;}
  @media(max-width:768px){
    header{padding:.8rem 1rem;}.logo-hangul{font-size:1.4rem;}
    section{padding:1rem !important;}
  }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:.8rem;">
    <a href="hangul_learn_v2.html#games" style="background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none;">←</a>
    <div class="logo"><span class="logo-hangul">한글</span><span class="logo-en">Learn Korean</span></div>
  </div>
  <div style="display:inline-block;background:linear-gradient(135deg,#FF6B6B,#A78BFA);color:#fff;padding:.3rem .9rem;border-radius:99px;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;font-weight:600;">🎮 PLAY · Time Practice</div>
</header>

<section style="max-width:700px;margin:0 auto;padding:2rem 1.5rem 3rem;">
  <h1 style="font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;line-height:1.15;margin-bottom:.6rem;letter-spacing:-.5px;">시간 읽기 연습<br><span style="color:#4D96FF;font-family:'Noto Sans KR',sans-serif;font-size:.7em;">Time Practice</span></h1>
  <p style="color:var(--text-muted);font-size:.95rem;line-height:1.7;margin-bottom:1.5rem;">시계를 보고 맞혀보거나, 직접 소리 내어 말해보세요.</p>

  <div class="pp-wrap" id="vocab-cards"></div>
</section>

<script>
function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=0.85;u.pitch=1;window.speechSynthesis.speak(u);}

// shared helper for minute reading (같은 로직을 Price Practice에서도 사용)
const ppDigits=['','일','이','삼','사','오','육','칠','팔','구'];
function ppConvertGroup(num){
  let str='';
  const units=['','십','백','천'];
  const d=String(num).padStart(4,'0').split('').map(Number);
  for(let i=0;i<4;i++){
    const digit=d[i],unit=units[3-i];
    if(digit===0)continue;
    str+=(digit===1&&unit!=='')?unit:ppDigits[digit]+unit;
  }
  return str;
}

// ===== Time Practice (시간 읽기 연습) =====
const tpHourWords=['','한','두','세','네','다섯','여섯','일곱','여덟','아홉','열','열한','열두'];
function tpHourToKorean(h){return tpHourWords[h]+' 시';}
function tpTimeToKorean(h,m){return (tpHourToKorean(h)+(m>0?' '+ppConvertGroup(m)+' 분':'')).trim();}
function tpFormatDigital(h,m){return `${h}시 ${String(m).padStart(2,'0')}분`;}
function tpRandomHour(){return Math.floor(Math.random()*12)+1;}
function tpRandomMinute(){return Math.floor(Math.random()*60);}
function tpHourDistractors(correct){
  const opts=new Set([correct]);
  let tries=0;
  while(opts.size<4&&tries<40){tries++;opts.add(tpRandomHour());}
  return [...opts].sort(()=>Math.random()-0.5);
}
function tpCombinedDistractors(hour,minute){
  const seen=new Set([hour+'|'+minute]);
  const list=[{h:hour,m:minute}];
  let tries=0;
  while(list.length<4&&tries<40){
    tries++;
    const r=Math.random();
    let h=hour,m=minute;
    if(r<0.4)h=tpRandomHour();
    else if(r<0.75)m=tpRandomMinute();
    else{h=tpRandomHour();m=tpRandomMinute();}
    const key=h+'|'+m;
    if(!seen.has(key)){seen.add(key);list.push({h,m});}
  }
  return list.sort(()=>Math.random()-0.5);
}
let tpState={mode:'hour',score:0,round:0,setSize:3,answered:false,current:{h:0,m:0},recognizing:false};
function initTimePractice(){
  tpState={mode:'hour',score:0,round:0,setSize:3,answered:false,current:{h:0,m:0},recognizing:false};
  tpRenderShell();
  tpNext();
}
function tpRenderShell(){
  const wrap=document.getElementById('vocab-cards');
  wrap.innerHTML=`
    <div class="pp-modes">
      <button class="pp-mode-btn" id="tp-mode-hour" onclick="tpSetMode('hour')">🕐 시간만 읽기</button>
      <button class="pp-mode-btn" id="tp-mode-combined" onclick="tpSetMode('combined')">🕐 시+분 읽기</button>
      <button class="pp-mode-btn" id="tp-mode-speak" onclick="tpSetMode('speak')">🎤 말해보기</button>
    </div>
    <div class="pp-score" id="tp-score"></div>
    <div id="tp-question"></div>
  `;
  tpUpdateModeButtons();
}
function tpUpdateModeButtons(){
  document.getElementById('tp-mode-hour').classList.toggle('active',tpState.mode==='hour');
  document.getElementById('tp-mode-combined').classList.toggle('active',tpState.mode==='combined');
  document.getElementById('tp-mode-speak').classList.toggle('active',tpState.mode==='speak');
}
function tpSetMode(mode){
  tpState.mode=mode;
  tpState.setSize=mode==='speak'?2:3;
  tpState.round=0;
  tpState.score=0;
  tpUpdateModeButtons();
  tpNext();
}
function tpUpdateScore(){
  document.getElementById('tp-score').textContent=`문제 ${Math.min(tpState.round+1,tpState.setSize)} / ${tpState.setSize}  ·  점수 ${tpState.score}`;
}
function tpNext(){
  if(tpState.round>=tpState.setSize){tpRenderSummary();return;}
  tpState.answered=false;
  tpState.current={h:tpRandomHour(),m:tpState.mode==='hour'?0:tpRandomMinute()};
  tpUpdateScore();
  if(tpState.mode==='hour')tpRenderHour();
  else if(tpState.mode==='combined')tpRenderCombined();
  else tpRenderSpeak();
}
function tpRenderSummary(){
  const q=document.getElementById('tp-question');
  const pct=Math.round((tpState.score/tpState.setSize)*100);
  const msg=pct===100?'완벽해요! 🎉':pct>=60?'잘했어요! 👍':'조금 더 연습해봐요 💪';
  q.innerHTML=`
    <div class="pp-scene">
      <div style="font-size:2.2rem;margin-bottom:.5rem;">${pct===100?'🏆':pct>=60?'😊':'📝'}</div>
      <div style="font-size:1.1rem;font-weight:800;color:#166534;margin-bottom:.3rem;">${msg}</div>
      <div style="font-size:.9rem;color:#475569;">이번 세트 점수: ${tpState.score} / ${tpState.setSize}</div>
    </div>
    <button class="pp-next-btn" onclick="tpRestartSet()">🔁 다시 하기</button>
  `;
}
function tpRestartSet(){tpState.round=0;tpState.score=0;tpNext();}
function tpRenderHour(){
  const {h}=tpState.current;
  const options=tpHourDistractors(h);
  const q=document.getElementById('tp-question');
  q.innerHTML=`
    <div class="pp-scene">
      <div class="pp-clerk-line">🕐 몇 시예요?</div>
      <div class="tp-clock">${h}시</div>
    </div>
    <div class="pp-options">
      ${options.map(o=>`<div class="pp-option" onclick="tpCheckHour(this,${o},${h})">${tpHourToKorean(o)}</div>`).join('')}
    </div>
    <div class="pp-feedback" id="tp-feedback"></div>
  `;
}
function tpCheckHour(el,chosen,correct){
  if(tpState.answered)return;
  tpState.answered=true;
  const opts=document.querySelectorAll('.pp-option');
  const fb=document.getElementById('tp-feedback');
  if(chosen===correct){
    tpState.score++;
    el.classList.add('correct');
    fb.textContent='✅ 정답이에요!';fb.style.color='#166534';
  }else{
    el.classList.add('wrong');
    opts.forEach(o=>{if(o.textContent.trim()===tpHourToKorean(correct))o.classList.add('correct');});
    fb.textContent=`❌ 정답은 ${tpHourToKorean(correct)}이에요`;fb.style.color='#991B1B';
  }
  tpState.round++;
  tpUpdateScore();
  speak(tpHourToKorean(correct));
  fb.insertAdjacentHTML('afterend',`<button class="pp-next-btn" onclick="tpNext()">${tpState.round>=tpState.setSize?'결과 보기 →':'다음 →'}</button>`);
}
function tpRenderCombined(){
  const {h,m}=tpState.current;
  const correctStr=tpTimeToKorean(h,m);
  const options=tpCombinedDistractors(h,m).map(({h,m})=>tpTimeToKorean(h,m));
  const q=document.getElementById('tp-question');
  q.innerHTML=`
    <div class="pp-scene">
      <div class="pp-clerk-line">🕐 몇 시 몇 분이에요?</div>
      <div class="tp-clock">${tpFormatDigital(h,m)}</div>
    </div>
    <div class="pp-options">
      ${options.map(o=>`<div class="pp-option" onclick="tpCheckCombined(this,'${o}','${correctStr}')">${o}</div>`).join('')}
    </div>
    <div class="pp-feedback" id="tp-feedback"></div>
  `;
}
function tpCheckCombined(el,chosen,correct){
  if(tpState.answered)return;
  tpState.answered=true;
  const opts=document.querySelectorAll('.pp-option');
  const fb=document.getElementById('tp-feedback');
  if(chosen===correct){
    tpState.score++;
    el.classList.add('correct');
    fb.textContent='✅ 정답이에요!';fb.style.color='#166534';
  }else{
    el.classList.add('wrong');
    opts.forEach(o=>{if(o.textContent.trim()===correct)o.classList.add('correct');});
    fb.textContent=`❌ 정답은 ${correct}이에요`;fb.style.color='#991B1B';
  }
  tpState.round++;
  tpUpdateScore();
  speak(correct);
  fb.insertAdjacentHTML('afterend',`<button class="pp-next-btn" onclick="tpNext()">${tpState.round>=tpState.setSize?'결과 보기 →':'다음 →'}</button>`);
}
function tpCheckSpeech(transcript,h,m){
  const norm=transcript.replace(/\s/g,'');
  const hourWord=tpHourWords[h];
  const hasHour=norm.includes(hourWord+'시')||norm.includes(String(h)+'시');
  let hasMinute=true;
  if(m>0){
    const minuteWord=ppConvertGroup(m);
    hasMinute=norm.includes(minuteWord+'분')||norm.includes(String(m)+'분');
  }
  return hasHour&&hasMinute;
}
function tpRenderSpeak(){
  const q=document.getElementById('tp-question');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    q.innerHTML=`
      <div class="tp-unsupported">🙏 이 기기(브라우저)에서는 마이크 녹음 기능을 지원하지 않아요.</div>
      <button class="pp-next-btn" onclick="tpSetMode('hour')">다른 연습으로</button>
    `;
    return;
  }
  const {h,m}=tpState.current;
  q.innerHTML=`
    <div class="pp-scene">
      <div class="pp-clerk-line">🎤 이 시간을 말해보세요</div>
      <div class="tp-clock">${tpFormatDigital(h,m)}</div>
      <button class="tp-mic-btn" id="tp-mic-btn" onclick="tpToggleMic()">🎙️</button>
      <div class="tp-mic-hint">마이크를 누르고 말한 뒤, 다시 눌러 완료하세요</div>
    </div>
    <div class="pp-feedback" id="tp-feedback"></div>
  `;
}
let tpRecognition=null,tpMediaRecorder=null,tpAudioChunks=[],tpFinalTranscript='';
function tpToggleMic(){
  const btn=document.getElementById('tp-mic-btn');
  if(tpState.recognizing){ tpStopRecording(); return; }
  if(window._micStream && window._micStream.active){
    tpStartRecording(window._micStream);
  }else{
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      window._micStream=stream;
      tpStartRecording(stream);
    }).catch(()=>{
      document.getElementById('tp-feedback').innerHTML='<div style="color:#F59E0B;font-size:.82rem;">⚠️ 마이크 권한이 필요해요.</div>';
    });
  }
}
function tpPickMimeType(){
  const testEl = document.createElement('audio');
  const canPlayWebm = testEl.canPlayType && testEl.canPlayType('audio/webm');
  if (canPlayWebm) return ''; // keep default (original working behavior)
  const types=['audio/mp4','audio/aac','audio/webm;codecs=opus'];
  for(const t of types){ if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t; }
  return '';
}
function tpStartRecording(stream){
  tpState.recognizing=true;
  tpAudioChunks=[];tpFinalTranscript='';
  const btn=document.getElementById('tp-mic-btn');
  btn.classList.add('recording');
  const mimeType=tpPickMimeType();
  tpMediaRecorder=mimeType?new MediaRecorder(stream,{mimeType}):new MediaRecorder(stream);
  tpMediaRecorder._mimeType=mimeType||'audio/webm';
  tpMediaRecorder.ondataavailable=e=>{if(e.data.size>0)tpAudioChunks.push(e.data);};
  tpMediaRecorder.onstop=()=>{
    const blob=new Blob(tpAudioChunks,{type:tpMediaRecorder._mimeType});
    window._tpLastRecordingUrl=URL.createObjectURL(blob);
    tpFinishRecording();
  };
  tpMediaRecorder.start();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    if(!tpRecognition){
      tpRecognition=new SR();
      tpRecognition.lang='ko-KR';tpRecognition.continuous=true;tpRecognition.interimResults=true;
      tpRecognition.onerror=()=>{};
    }
    tpRecognition.onresult=e=>{
      tpFinalTranscript='';
      for(let i=0;i<e.results.length;i++){if(e.results[i].isFinal)tpFinalTranscript+=e.results[i][0].transcript;}
    };
    tpRecognition.onend=()=>{}; // continuous:true keeps it running; no manual restart needed
    try{tpRecognition.start();}catch(e){}
  }
}
function tpStopRecording(){
  if(tpRecognition){try{tpRecognition.stop();}catch(e){}}
  if(tpMediaRecorder&&tpMediaRecorder.state==='recording')tpMediaRecorder.stop();
}
function tpPlayRecording(){
  if(!window._tpLastRecordingUrl)return;
  const audio=new Audio(window._tpLastRecordingUrl);
  audio.play().catch(()=>{
    const fb=document.getElementById('tp-feedback');
    if(fb)fb.insertAdjacentHTML('beforeend','<div style="color:#F59E0B;font-size:.75rem;margin-top:.4rem;">⚠️ 이 브라우저에서는 녹음 재생이 지원되지 않아요.</div>');
  });
}
function tpFinishRecording(){
  const btn=document.getElementById('tp-mic-btn');
  if(btn)btn.classList.remove('recording');
  tpState.recognizing=false;
  const {h,m}=tpState.current;
  const correctStr=tpTimeToKorean(h,m);
  const fb=document.getElementById('tp-feedback');
  const playBtn=`<button class="pp-receipt-speak" onclick="tpPlayRecording()">🔊 내 발음</button>`;
  if(tpFinalTranscript){
    const correct=tpCheckSpeech(tpFinalTranscript,h,m);
    if(correct){
      tpState.score++;
      fb.innerHTML=`<div style="color:#166534;font-weight:700;">🔔 딩동댕! 정답이에요!</div><div style="font-size:.78rem;color:#64748B;margin:.3rem 0;">"${tpFinalTranscript}"</div>${playBtn}`;
    }else{
      fb.innerHTML=`<div style="color:#991B1B;font-weight:700;">🔁 다시 한번 들어보세요</div><div style="font-size:.78rem;color:#64748B;margin:.3rem 0;">You: "${tpFinalTranscript}" → ${correctStr}</div>${playBtn}`;
      speak(correctStr);
    }
    tpState.round++;
    tpUpdateScore();
    fb.insertAdjacentHTML('beforeend',`<button class="pp-next-btn" onclick="tpNext()">${tpState.round>=tpState.setSize?'결과 보기 →':'다음 →'}</button>`);
  }else{
    fb.innerHTML=`<div style="font-size:.85rem;color:#334155;margin-bottom:.5rem;">🎧 녹음됐어요! 들어보고 맞게 말했는지 체크해보세요</div>${playBtn}<div style="display:flex;gap:.6rem;justify-content:center;margin-top:.7rem;"><button class="pp-next-btn" style="background:#22C55E;margin:0;" onclick="tpSelfGrade(true)">✅ 맞게 말했어요</button><button class="pp-next-btn" style="background:#EF4444;margin:0;" onclick="tpSelfGrade(false)">❌ 틀렸어요</button></div>`;
  }
}
function tpSelfGrade(correct){
  const {h,m}=tpState.current;
  const correctStr=tpTimeToKorean(h,m);
  const fb=document.getElementById('tp-feedback');
  if(correct){
    tpState.score++;
    fb.innerHTML='<div style="color:#166534;font-weight:700;">✅ 좋아요!</div>';
  }else{
    fb.innerHTML=`<div style="color:#991B1B;font-weight:700;">🔁 다시 한번 들어보세요</div><div style="font-size:.78rem;color:#64748B;margin-top:.3rem;">→ ${correctStr}</div>`;
    speak(correctStr);
  }
  tpState.round++;
  tpUpdateScore();
  fb.insertAdjacentHTML('beforeend',`<button class="pp-next-btn" onclick="tpNext()">${tpState.round>=tpState.setSize?'결과 보기 →':'다음 →'}</button>`);
}

initTimePractice();
</script>
</body>
</html>
