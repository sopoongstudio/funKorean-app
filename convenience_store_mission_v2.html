<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>편의점 게임 🏪</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sky: #87CEEB;
  --ground: #8B7355;
  --sidewalk: #C8C0B0;
  --store-wall: #FFF8F0;
  --store-roof: #E74C3C;
  --sign-blue: #2980B9;
  --shelf-brown: #8B6340;
  --floor-tile: #F0EDE8;
  --ui-blue: #3b5bdb;
  --ui-green: #2f9e44;
  --ui-yellow: #f59f00;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 16px;
}

.game-wrap {
  width: 100%;
  max-width: 700px;
}

.game-title {
  text-align: center;
  color: white;
  font-size: 1.4rem;
  font-weight: 900;
  letter-spacing: 1px;
}
.game-subtitle {
  text-align: center;
  color: #9aa3c9;
  font-size: 0.75rem;
  font-weight: 700;
  margin-bottom: 10px;
}

/* HUD */
.hud {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.hud-box {
  background: rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 6px 14px;
  color: white;
  font-weight: 700;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.hud-box.money { border: 1px solid #2ecc71; color: #2ecc71; }
.hud-box.basket { border: 1px solid #74b9ff; color: #74b9ff; }
.hud-box.coupon { border: 1px solid #f9ca24; color: #f9ca24; display: none; }

/* Game canvas */
.game-canvas {
  width: 100%;
  aspect-ratio: 16/10;
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  border: 3px solid rgba(255,255,255,0.1);
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}

/* ========== SCENE: OUTSIDE ========== */
.scene-outside {
  width: 100%; height: 100%;
  position: absolute;
  display: none;
}
.scene-outside.active { display: block; }

.sky {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 55%;
  background: linear-gradient(180deg, #1a1a6e 0%, #87CEEB 100%);
}
.sun {
  position: absolute;
  top: 12%; right: 12%;
  width: 50px; height: 50px;
  background: #FFD700;
  border-radius: 50%;
  box-shadow: 0 0 30px #FFD700;
}
.cloud {
  position: absolute;
  background: white;
  border-radius: 20px;
  opacity: 0.9;
}

.ground-area {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 45%;
  background: var(--sidewalk);
}
.ground-line {
  position: absolute;
  bottom: 30%;
  left: 0; right: 0;
  height: 4px;
  background: #aaa9a0;
}

/* Store building */
.store-building {
  position: absolute;
  bottom: 28%;
  left: 50%; transform: translateX(-50%);
  width: 55%;
}
.store-roof-el {
  background: var(--store-roof);
  height: 18px;
  border-radius: 4px 4px 0 0;
  position: relative;
}
.store-body {
  background: var(--store-wall);
  height: 120px;
  position: relative;
  border: 2px solid #ddd;
}
.store-sign-el {
  background: var(--sign-blue);
  color: white;
  text-align: center;
  font-weight: 900;
  font-size: 1rem;
  padding: 4px 0;
  letter-spacing: 3px;
}
.store-windows {
  display: flex;
  justify-content: space-around;
  padding: 8px;
  height: 60px;
}
.store-window {
  background: linear-gradient(135deg, #a8d8ea, #7ec8e3);
  width: 28%;
  border: 2px solid #5ba3c9;
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.store-window::after {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  width: 2px; height: 100%;
  background: rgba(255,255,255,0.4);
}
.store-door {
  width: 26%;
  margin: 0 auto;
  height: 50px;
  background: linear-gradient(135deg, #a8d8ea, #7ec8e3);
  border: 2px solid #5ba3c9;
  border-bottom: none;
  border-radius: 4px 4px 0 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
  color: #2c5f7a;
  font-weight: 700;
  overflow: hidden;
  transition: background 0.4s;
}
.door-open {
  background: linear-gradient(135deg, #fff8f0 30%, #a8d8ea 100%) !important;
}

/* Character */
.character {
  position: absolute;
  bottom: 28%;
  width: 48px;
  transition: left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}
.char-body-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
}
/* Head */
.char-head {
  width: 28px; height: 28px;
  background: #FDDBB4;
  border-radius: 50%;
  position: relative;
  z-index: 2;
}
.char-hair {
  position: absolute;
  top: -4px; left: -3px;
  width: 34px; height: 20px;
  background: #4a2800;
  border-radius: 50% 50% 0 0;
}
.char-bangs {
  position: absolute;
  top: 4px; left: -3px;
  width: 34px; height: 10px;
  background: #4a2800;
  border-radius: 0 0 8px 8px;
}
.char-eye-l, .char-eye-r {
  position: absolute;
  top: 12px;
  width: 5px; height: 5px;
  background: #2c1810;
  border-radius: 50%;
}
.char-eye-l { left: 5px; }
.char-eye-r { right: 5px; }
.char-mouth {
  position: absolute;
  bottom: 5px; left: 50%;
  transform: translateX(-50%);
  width: 8px; height: 4px;
  border-bottom: 2px solid #c0826a;
  border-radius: 0 0 4px 4px;
}
/* Body */
.char-torso {
  width: 24px; height: 22px;
  background: #FF6B9D;
  border-radius: 4px 4px 0 0;
  margin-top: -2px;
}
/* Legs */
.char-legs {
  display: flex;
  gap: 4px;
  margin-top: 1px;
}
.char-leg {
  width: 10px; height: 18px;
  background: #3b5bdb;
  border-radius: 0 0 3px 3px;
  position: relative;
  transform-origin: top center;
}
.char-leg.walk-l { animation: none; }
.char-leg.walk-r { animation: none; }
.char-leg.walking-l { animation: walkL 0.4s infinite alternate; }
.char-leg.walking-r { animation: walkR 0.4s infinite alternate; }
/* Shoes */
.char-leg::after {
  content: '';
  position: absolute;
  bottom: -4px; left: -2px;
  width: 14px; height: 6px;
  background: #fff;
  border-radius: 2px;
}
/* Arms */
.char-torso-row {
  display: flex;
  align-items: flex-start;
  gap: 2px;
  margin-top: -2px;
}
.char-arm {
  width: 7px; height: 16px;
  background: #FF6B9D;
  border-radius: 4px;
  margin-top: 2px;
}
.char-arm.left { transform: rotate(10deg); }
.char-arm.right { transform: rotate(-10deg); }
/* Bag */
.char-bag {
  position: absolute;
  bottom: 2px; right: -14px;
  width: 14px; height: 18px;
  background: white;
  border: 2px solid #ccc;
  border-radius: 2px;
  display: none;
}
.char-bag::after {
  content: '';
  position: absolute;
  top: -6px; left: 50%;
  transform: translateX(-50%);
  width: 8px; height: 6px;
  border: 2px solid #aaa;
  border-bottom: none;
  border-radius: 4px 4px 0 0;
}

@keyframes walkL {
  from { transform: rotate(-20deg); }
  to { transform: rotate(20deg); }
}
@keyframes walkR {
  from { transform: rotate(20deg); }
  to { transform: rotate(-20deg); }
}

/* Enter button */
.enter-btn {
  position: absolute;
  bottom: 6%;
  left: 50%; transform: translateX(-50%);
  background: #2ecc71;
  color: white;
  border: none;
  border-radius: 20px;
  padding: 8px 28px;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  line-height: 1.4;
  box-shadow: 0 4px 12px rgba(46,204,113,0.4);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%,100% { transform: translateX(-50%) scale(1); }
  50% { transform: translateX(-50%) scale(1.05); }
}
.enter-btn:hover { background: #27ae60; }

/* ========== SCENE: INSIDE ========== */
.scene-inside {
  width: 100%; height: 100%;
  position: absolute;
  display: none;
  background: var(--floor-tile);
}
.scene-inside.active { display: block; }

/* Floor tiles */
.floor-tiles {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 25%;
  background:
    repeating-linear-gradient(90deg, transparent, transparent 49px, #ddd 49px, #ddd 50px),
    repeating-linear-gradient(0deg, transparent, transparent 49px, #ddd 49px, #ddd 50px);
  background-color: #f5f0e8;
}

/* Ceiling */
.ceiling {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 12%;
  background: #e8e4de;
  border-bottom: 3px solid #d0ccc5;
}
.ceiling-light {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  height: 10px; background: #fffbe6;
  border-radius: 4px;
  box-shadow: 0 0 20px 6px rgba(255,251,200,0.6);
}

/* Shelves */
.shelf-unit {
  position: absolute;
  background: var(--shelf-brown);
  border-radius: 4px;
  cursor: pointer;
  transition: filter 0.15s, transform 0.15s;
}
.shelf-unit:hover { filter: brightness(1.15); transform: scale(1.02); }

.shelf-label {
  position: absolute;
  top: -24px; left: 50%; transform: translateX(-50%);
  background: white;
  border: 2px solid var(--ui-blue);
  border-radius: 8px;
  padding: 2px 10px;
  font-size: 0.7rem;
  font-weight: 800;
  color: var(--ui-blue);
  white-space: nowrap;
  pointer-events: none;
}

.shelf-items-display {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 4px;
  height: 100%;
  padding: 6px 4px 4px;
}
.shelf-item-icon {
  font-size: 1.4rem;
  filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3));
}

/* Checkout counter */
.counter {
  position: absolute;
  bottom: 22%;
  right: 2%;
  width: 20%;
  height: 14%;
  background: #5d4037;
  border-radius: 6px 6px 0 0;
  cursor: pointer;
  transition: filter 0.15s;
}
.counter:hover { filter: brightness(1.2); }
.counter-top {
  position: absolute;
  top: -8px; left: -4px; right: -4px;
  height: 12px;
  background: #795548;
  border-radius: 4px;
}
.counter-label {
  position: absolute;
  top: -60px; left: 50%; transform: translateX(-50%);
  background: #e74c3c;
  color: white;
  border-radius: 8px;
  padding: 4px 12px;
  font-size: 0.75rem;
  font-weight: 800;
  white-space: nowrap;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.counter-register {
  position: absolute;
  top: -28px; left: 10px;
  width: 30px; height: 20px;
  background: #333;
  border-radius: 4px;
}

/* Clerk */
.clerk {
  position: absolute;
  bottom: 38%;
  right: 4%;
  width: 36px;
  z-index: 2;
}

/* Inside character */
.char-inside {
  position: absolute;
  bottom: 23%;
  transition: left 0.7s cubic-bezier(0.4,0,0.2,1), bottom 0.5s;
}

/* Speech bubble */
.speech-bubble {
  position: absolute;
  background: white;
  border: 2px solid var(--ui-blue);
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--ui-blue);
  white-space: nowrap;
  bottom: 110%;
  left: 50%; transform: translateX(-50%);
  display: none;
  z-index: 10;
}
.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -8px; left: 50%; transform: translateX(-50%);
  border: 8px solid transparent;
  border-top-color: var(--ui-blue);
  border-bottom: none;
}

/* Section nav buttons */
.section-nav {
  position: absolute;
  bottom: 2%;
  left: 50%; transform: translateX(-50%);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
.nav-btn {
  background: var(--ui-blue);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 6px 12px;
  font-size: 0.75rem;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
.nav-btn:hover { background: #2f4abf; }
.nav-btn.checkout { background: #e74c3c; }
.nav-btn.checkout:hover { background: #c0392b; }

/* ========== POPUP ========== */
.popup-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  border-radius: 14px;
}
.popup-overlay.show { display: flex; }
.popup {
  background: white;
  border-radius: 16px;
  padding: 20px;
  max-width: 85%;
  width: 320px;
  text-align: center;
  animation: popIn 0.2s ease;
}
@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.p-emoji { font-size: 3rem; margin-bottom: 8px; display: block; }
.p-kr { font-size: 1.5rem; font-weight: 900; color: var(--ui-blue); }
.p-romaji { font-size: 0.85rem; color: #888; margin: 2px 0; }
.p-en { font-size: 0.85rem; color: #333; margin-bottom: 6px; }
.p-price { font-size: 1rem; font-weight: 800; color: var(--ui-green); margin-bottom: 12px; }
.popup-btns { display: flex; gap: 8px; }
.pbtn { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 0.85rem; font-weight: 800; cursor: pointer; font-family: inherit; }
.pbtn-add { background: var(--ui-blue); color: white; }
.pbtn-close { background: #f1f3f5; color: #333; }

/* Payment popup */
.clerk-says {
  background: #e7ecff;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 12px;
  font-size: 1rem;
  font-weight: 800;
  color: var(--ui-blue);
}
.clerk-says small { display: block; color: #888; font-weight: 400; font-size: 0.75rem; }
.money-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; justify-content: center; }
.mbtn {
  background: #fff9e6;
  border: 2px solid #f59f00;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 0.78rem;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  color: #7c6d00;
}
.mbtn.sel { background: #f59f00; color: white; }
.selected-total { background: #f8f9fa; border-radius: 8px; padding: 6px; font-size: 0.82rem; font-weight: 700; margin-bottom: 8px; color: #333; }
.change-box { background: #d3f9d8; border-radius: 8px; padding: 8px; font-size: 0.85rem; font-weight: 800; color: #2f9e44; margin-bottom: 10px; display: none; }

/* Result */
.result-big { font-size: 3.5rem; }
.result-ttl { font-size: 1.3rem; font-weight: 900; margin: 8px 0 4px; }
.result-sub { font-size: 0.82rem; color: #666; margin-bottom: 12px; line-height: 1.5; }
.coupon-box { background: #fff3bf; border: 2px solid #f59f00; border-radius: 10px; padding: 8px; font-size: 0.82rem; font-weight: 800; color: #7c6d00; margin-bottom: 10px; display: none; }

/* ===== MISSION PRE-GAME PHASES ===== */
.phase { display: none; width: 100%; max-width: 460px; }
.phase.show { display: block; }
.phase-card {
  background: white; border-radius: 20px; padding: 24px; text-align: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.35);
}
.phase-step {
  display: inline-block; background: var(--ui-blue); color: white; font-weight: 800;
  font-size: 0.75rem; padding: 4px 14px; border-radius: 20px; margin-bottom: 14px; letter-spacing: 0.5px;
}
.mini-cal { background: #f0f4ff; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
.mini-cal-month { font-weight: 900; font-size: 1.05rem; color: #333; margin-bottom: 10px; }
.mini-cal-row { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.mini-cal-head { font-size: 0.72rem; font-weight: 800; color: #999; padding: 4px 0; }
.mini-cal-cell { font-size: 0.85rem; padding: 8px 0; border-radius: 8px; color: #333; }
.mini-cal-cell.today { background: #e74c3c; color: white; font-weight: 900; box-shadow: 0 0 0 3px #ffe3e3; }
.phase-q { font-weight: 800; margin-bottom: 12px; font-size: 0.95rem; color: #333; }
.choice-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
.choice-btn {
  background: #e7ecff; color: var(--ui-blue); border: 2px solid transparent; border-radius: 12px;
  padding: 12px 6px; font-size: 0.9rem; font-weight: 800; cursor: pointer; font-family: inherit;
}
.choice-btn:hover { border-color: var(--ui-blue); }
.choice-btn.correct { background: #d3f9d8; color: var(--ui-green); border-color: var(--ui-green); }
.choice-btn.wrong { background: #ffe3e3; color: #e03131; border-color: #e03131; }
.phase-feedback { min-height: 22px; font-weight: 800; font-size: 0.88rem; margin-top: 10px; }
.phase-feedback.ok { color: var(--ui-green); }
.phase-feedback.no { color: #e03131; }
.event-emoji { font-size: 3.2rem; margin-bottom: 10px; }
.event-text { font-size: 1.1rem; font-weight: 900; color: var(--ui-yellow); margin-bottom: 4px; }
.event-romaji { font-size: 0.8rem; color: #999; margin-bottom: 4px; }
.event-en { font-size: 0.82rem; color: #333; margin-bottom: 18px; }
.btn-main {
  width: 100%; background: var(--ui-blue); color: white; border: none; border-radius: 12px;
  padding: 13px; font-size: 0.98rem; font-weight: 800; cursor: pointer; font-family: inherit;
}
.btn-main:hover { background: #2f4abf; }

/* ===== ESCAPE OVERLAY ===== */
.escape-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: center; justify-content: center; z-index: 80; border-radius: 14px;
}
.escape-overlay.show { display: flex; }
.escape-card { background: white; border-radius: 18px; padding: 26px; text-align: center; width: 85%; max-width: 320px; }
.escape-emoji { font-size: 3.5rem; margin-bottom: 10px; }
.escape-title { font-size: 1.25rem; font-weight: 900; color: var(--ui-green); margin-bottom: 8px; }
.escape-msg { font-size: 0.85rem; color: #666; margin-bottom: 16px; line-height: 1.5; }

/* ===== CHECKOUT QUIZ ===== */
.clerk-digit { font-size: 1.3rem; font-weight: 900; color: #333; margin-bottom: 4px; }
.pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
.pay-opt {
  background: #e7ecff; color: var(--ui-blue); border: 2px solid transparent; border-radius: 10px;
  padding: 12px 6px; font-size: 0.92rem; font-weight: 800; cursor: pointer; font-family: inherit;
}
.pay-opt:hover { border-color: var(--ui-blue); }
.pay-opt.correct { background: #d3f9d8; color: var(--ui-green); border-color: var(--ui-green); }
.pay-opt.wrong { background: #ffe3e3; color: #e03131; border-color: #e03131; }
.pay-feedback { min-height: 20px; font-weight: 800; font-size: 0.85rem; text-align: center; }

/* ===== JAIL BARS ===== */
.jail-bars {
  position: absolute; inset: 0; z-index: 4; pointer-events: none;
  display: flex; justify-content: space-between; padding: 0 2%;
  transform: translateY(-115%);
  transition: transform 0.45s cubic-bezier(.36,1.4,.6,1);
}
.jail-bars.dropped { transform: translateY(0); }
.jail-bars.opened { transform: translateY(-140%); transition: transform 0.9s ease-in; }
.jail-bars .bar {
  width: 1.1%; height: 100%;
  background: linear-gradient(90deg, #4a4a4a, #9a9a9a 40%, #4a4a4a 60%, #2a2a2a);
  border-radius: 0 0 3px 3px;
  box-shadow: 1px 0 4px rgba(0,0,0,0.35);
  opacity: 0.9;
}

/* ===== DEVIL CLERK ===== */
.devil-horns {
  position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
  display: none; width: 26px; z-index: 5;
}
.clerk.devil .devil-horns { display: block; }
.devil-horns .horn {
  position: absolute; top: 0; width: 0; height: 0;
  border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 10px solid #b71c1c;
}
.devil-horns .horn.left { left: 0; transform: rotate(-15deg); }
.devil-horns .horn.right { right: 0; transform: rotate(15deg); }
.clerk.devil #clerk-torso, .clerk.devil #clerk-arm-l, .clerk.devil #clerk-arm-r {
  background: #c0392b !important;
}
.clerk.devil #clerk-eye-l, .clerk.devil #clerk-eye-r {
  background: #ff1744 !important; box-shadow: 0 0 6px 2px #ff1744;
}
.clerk.devil { animation: devilShake 0.15s infinite; }
@keyframes devilShake {
  0%,100% { transform: translateX(0); } 50% { transform: translateX(1.5px); }
}
.popup.devil-flash { animation: devilFlash 0.5s ease; }
@keyframes devilFlash {

</div>

<div class="game-wrap" id="game-wrap" style="display:none">

  <div class="game-canvas">

  </div>
</div>

function wonToKr(n) {
  if (n === 0) return '영 원';
  n = Number(n) || 0;
  const u = ['','일','이','삼','사','오','육','칠','팔','구'];
  let r = '';
  const man = Math.floor(n/10000), rest = n%10000;
  const cheon = Math.floor(rest/1000), baek = Math.floor((rest%1000)/100);
  const sip = Math.floor((rest%100)/10), il = rest%10;
  if (man) r += (man>1?u[man]:'') + '만';
  if (cheon) r += (cheon>1?u[cheon]:'') + '천';
  if (baek) r += (baek>1?u[baek]:'') + '백';
  if (sip) r += (sip>1?u[sip]:'') + '십';
  if (il) r += u[il];
  return r + ' 원';
}

  const m = {'만':'man','일':'il','이':'i','삼':'sam','사':'sa','오':'o','육':'yuk','칠':'chil','팔':'pal','구':'gu','천':'cheon','백':'baek','십':'sip','원':'won',' ':'-'};
  return wonToKr(n).split('').map(c=>m[c]||c).join('').replace(/([a-z])([가-힣])/g,'$1-$2');
}

function speak(txt) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'ko-KR'; u.rate = 0.85;
  speechSynthesis.speak(u);
}

// ===== SYNTHESIZED SOUND EFFECTS =====
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function noiseBurst(ctx, t, dur, freq, q, gainPeak) {
  const bufferSize = Math.floor(ctx.sampleRate * dur);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/(bufferSize*0.4));
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filt = ctx.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = freq; filt.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(gainPeak, t);
  g.gain.exponentialRampToValueAtTime(0.01, t + dur);
  noise.connect(filt).connect(g).connect(ctx.destination);
  noise.start(t);
}
function playClang() {
  try {
    const ctx = getCtx();
    const t = ctx.currentTime;
    noiseBurst(ctx, t, 0.3, 1400, 4, 0.5);
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.3);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.6, t);
    g.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
    osc.connect(g).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.35);
  } catch(e) {}
}
function playEvilLaugh() {
  try {
    const ctx = getCtx();
    const notes = [220,180,220,160,200,140];
    notes.forEach((f, i) => {
      const t = ctx.currentTime + i*0.14;
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, t);
      osc.frequency.exponentialRampToValueAtTime(f*0.7, t+0.11);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.22, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.13);
      osc.connect(g).connect(ctx.destination);
      osc.start(t); osc.stop(t+0.14);
    });
  } catch(e) {}
}
function playFireworks() {
  try {
    const ctx = getCtx();
    for (let i = 0; i < 5; i++) {
      const t = ctx.currentTime + i*0.16;
      noiseBurst(ctx, t, 0.22, 2000 + Math.random()*1500, 2, 0.28);
    }
  } catch(e) {}
}
function spawnConfetti(container) {
  const colors = ['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#f368e0','#54a0ff'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (Math.random()*100) + '%';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (0.8 + Math.random()*0.9) + 's';
    el.style.animationDelay = (Math.random()*0.3) + 's';
    container.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  }
}

// ===== PAYMENT =====
function computeTotal() {
  let total = 0;
  cart.forEach(c => {
    const item = ALL_ITEMS.find(i => i.id === c.id);
    let effQty = c.qty;
    if (currentEvent && currentEvent.type === 'bogo' && c.id === currentEvent.target) {
      effQty = Math.ceil(c.qty / 2); // buy-one-get-one-free -> pay for half, rounded up
    }
    total += getPrice(item) * effQty;
  });
  return total;
}

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildAmountOptions(correct) {
  const set = new Set([correct]);
  const deltas = [10,20,30,50,100,-10,-20,-30,-50,-100];
  let guard = 0;
  while (set.size < 4 && guard < 50) {
    const d = deltas[Math.floor(Math.random() * deltas.length)];
    const val = correct + d;
    if (val > 0 && val % 10 === 0) set.add(val);
    guard++;
  }
  return shuffleArr([...set]);
}

// ===== PHASE 1: WEEKDAY MINI-GAME =====
// ===== Korean date reading helpers =====
function numKr(n) {
  const u = ['','일','이','삼','사','오','육','칠','팔','구'];
  const sip = Math.floor(n/10), il = n%10;
  let r = '';
  if (sip) r += (sip>1 ? u[sip] : '') + '십';
  if (il) r += u[il];
  return r;
}
function monthKr(n) {
  if (n === 6) return '유월';
  if (n === 10) return '시월';
  return numKr(n) + '월';
}
function dayKr(n) {
  return numKr(n) + '일';
}
function dateKr(m, d) {
  return monthKr(m) + ' ' + dayKr(d);
}
function dateRomaji(m, d) {
  const map = {'일':'il','이':'i','삼':'sam','사':'sa','오':'o','육':'yuk','칠':'chil','팔':'pal','구':'gu','십':'sip','월':'wol',' ':'-'};
  const kr = m===6 ? '유월' : (m===10 ? '시월' : (numKr(m)+'월'));
  const dr = numKr(d) + '일';
  const full = kr + ' ' + dr;
  return full.split('').map(c => map[c] || c).join('').replace(/-+/g,'-');
}

let currentMonth = 0, currentDay = 0;

function setupWeekday() {
  currentMonth = Math.floor(Math.random() * 12) + 1;
  currentDay = Math.floor(Math.random() * 28) + 1;
  const correctIdx = Math.floor(Math.random() * 7);

  document.getElementById('mini-cal-month').textContent = currentMonth + '월 ' + currentDay + '일';

  const headRow = document.getElementById('mini-cal-head');
  headRow.innerHTML = '';
  WEEKDAYS_HEAD.forEach(d => {
    const div = document.createElement('div');
    div.className = 'mini-cal-head';
    div.textContent = d;
    headRow.appendChild(div);
  });

  const dateRow = document.getElementById('mini-cal-dates');
  dateRow.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const div = document.createElement('div');
    div.className = 'mini-cal-cell' + (i === correctIdx ? ' today' : '');
    div.textContent = i === correctIdx ? currentDay : '';
    dateRow.appendChild(div);
  }

  document.getElementById('date-reveal').style.display = 'none';
  document.getElementById('weekday-feedback').textContent = '';

  const options = buildDateOptions(currentMonth, currentDay);
  const grid = document.getElementById('weekday-choices');
  grid.innerHTML = '';
  options.forEach(([m, d]) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = dateKr(m, d);
    btn.onclick = () => checkDateAnswer(btn, m, d);
    grid.appendChild(btn);
  });

  speak(dateKr(currentMonth, currentDay) + '이에요');
}

function replayDate() {
  speak(dateKr(currentMonth, currentDay) + '이에요');
}

function buildDateOptions(month, day) {
  const results = [[month, day]];
  const candidates = [
    [month, day + 1], [month, day - 1], [month, day + 2], [month, day - 2],
    [month === 12 ? 1 : month + 1, day], [month === 1 ? 12 : month - 1, day],
    [month, day + 10 <= 28 ? day + 10 : day - 10],
  ];
  for (const [m, d] of shuffleArr(candidates)) {
    if (results.length >= 4) break;
    if (m < 1 || m > 12 || d < 1 || d > 28) continue;
    if (results.some(r => r[0] === m && r[1] === d)) continue;
    results.push([m, d]);
  }
  return shuffleArr(results);
}

function checkDateAnswer(btn, m, d) {
  const fb = document.getElementById('weekday-feedback');
  if (m === currentMonth && d === currentDay) {
    btn.classList.add('correct');
    fb.textContent = '정답이에요! 👍';
    fb.className = 'phase-feedback ok';
    const reveal = document.getElementById('date-reveal');
    reveal.style.display = 'block';
    reveal.textContent = dateKr(currentMonth, currentDay) + ' · ' + dateRomaji(currentMonth, currentDay);
    document.querySelectorAll('#weekday-choices .choice-btn').forEach(b => b.onclick = null);
    setTimeout(setupEvent, 1300);
  } else {
    btn.classList.add('wrong');
    fb.textContent = '다시 골라보세요!';
    fb.className = 'phase-feedback no';
    setTimeout(() => btn.classList.remove('wrong'), 500);
  }
}
